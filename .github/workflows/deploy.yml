name: جدولة نشر المقالات

# ═══════════════════════════════════════════════════════════
#  ⚠️ هذا الملف لا يبني الموقع ولا ينشره.
#
#  البناء والنشر تتولاهما Cloudflare Pages مباشرة عبر ربط Git:
#      أي دفعة إلى main  ←  Cloudflare يبني وينشر تلقائياً
#
#  فلماذا يوجد هذا الملف إذن؟
#  ────────────────────────────────────────────────────────
#  الموقع ثابت (output:"export") — يعني أن المقال المجدول
#  لـ 15 سبتمبر لن يظهر من تلقاء نفسه؛ يحتاج بناءً جديداً
#  في ذلك اليوم. لا يوجد خادم يفحص الوقت.
#
#  فوظيفة هذا الملف الوحيدة: أن يستيقظ كل ساعتين، ويسأل
#  «هل استحقّ مقال؟»، وإن كانت الإجابة نعم يدفع commit فارغاً
#  إلى main — فيلتقطه Cloudflare ويبني.
#
#  🔐 لماذا هذا التصميم؟
#  ────────────────────────────────────────────────────────
#  لا يحتاج CLOUDFLARE_API_TOKEN ولا CLOUDFLARE_ACCOUNT_ID
#  ولا أي سرّ خارجي على الإطلاق. يستخدم GITHUB_TOKEN المدمج
#  الذي تولّده GitHub لكل تشغيل ويُبطله بعده. صفر أسرار
#  لتسريبها، وصفر أسرار لتدويرها.
#
#  💰 الحدود المجانية
#  ────────────────────────────────────────────────────────
#  • Cloudflare Pages : 500 بناء / شهر
#    ← 90 مقالاً موزّعة على 8 أشهر = ~12 بناءً شهرياً (2.4%)
#  • GitHub Actions   : 2,000 دقيقة / شهر
#    ← الفحص ~25 ثانية × 360 مرة شهرياً = ~150 دقيقة (7.5%)
#
#  أقصى تأخير بين موعد المقال وظهوره فعلياً: ساعتان.
# ═══════════════════════════════════════════════════════════

on:
  # كل ساعتين — الفحص رخيص، والبناء وحده هو المكلف
  schedule:
    - cron: "0 */2 * * *"

  # تشغيل يدوي من تبويب Actions
  workflow_dispatch:
    inputs:
      force:
        description: "ادفع بناءً حتى لو لم يستحق أي مقال"
        type: boolean
        default: false

# لا تتراكم عمليتان معاً لو تأخّر تشغيل سابق
concurrency:
  group: article-scheduler
  cancel-in-progress: false

permissions:
  contents: write # لدفع الـ commit الفارغ فقط — لا شيء غير ذلك

jobs:
  publish-due-articles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── هل استحقّ مقال في آخر ساعتين؟ ──────────────────
      # السكربت يخرج بـ 0 (نعم) أو 1 (لا)، ويكتب should_build
      # و due_slugs في GITHUB_OUTPUT.
      - id: due
        continue-on-error: true
        run: node scripts/check-due-articles.mjs --window 2

      # ── نعم: ادفع commit فارغاً ليلتقطه Cloudflare ──────
      - name: إطلاق بناء Cloudflare
        id: trigger
        if: steps.due.outputs.should_build == 'true' || inputs.force
        run: |
          git config user.name  "rawajgate-scheduler[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(نشر): إطلاق بناء للمقالات المستحقة — ${{ steps.due.outputs.due_slugs || 'تشغيل يدوي' }}"

          # ⚠️ الفشل الوحيد المتوقّع هنا هو 403 عند الدفع، وسببه دائماً
          # إعداد واحد: Settings ← Actions ← General ← Workflow permissions
          # مضبوط على «Read repository contents». يجب أن يكون
          # «Read and write permissions» وإلا لن يُنشر أي مقال أبداً —
          # بصمت، لأن الفحص ينجح والدفع وحده يفشل.
          if ! git push; then
            echo "::error title=فشل دفع الـ commit::تعذّر على GITHUB_TOKEN الكتابة. اضبط Settings ← Actions ← General ← Workflow permissions على «Read and write permissions»."
            exit 1
          fi

      # ── ملخّص يظهر في واجهة Actions ─────────────────────
      # ⚠️ يعتمد على نتيجة خطوة الدفع نفسها لا على «هل استحقّ مقال».
      # لو اعتمد على الثانية فقط لأعلن النجاح حتى حين يفشل الدفع —
      # وهو أسوأ أنواع الأعطال: يبدو كل شيء سليماً والموقع لا يتحدّث.
      - name: الملخّص
        if: always()
        run: |
          DUE="${{ steps.due.outputs.due_slugs || 'تشغيل يدوي' }}"
          case "${{ steps.trigger.outcome }}" in
            success)
              echo "### 🚀 أُطلق بناء Cloudflare" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**المقالات المستحقة:** $DUE" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "تابع البناء في لوحة Cloudflare ← Workers & Pages ← rawajgate" >> "$GITHUB_STEP_SUMMARY"
              ;;
            failure)
              echo "### ❌ استحقّ مقال لكن تعذّر إطلاق البناء" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**المقالات العالقة:** $DUE" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "السبب شبه المؤكّد: صلاحية الكتابة." >> "$GITHUB_STEP_SUMMARY"
              echo "Settings ← Actions ← General ← Workflow permissions ← **Read and write permissions**" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "### 😴 لا مقال مستحقاً" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "لم يُستهلك أي بناء من حصة Cloudflare." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
